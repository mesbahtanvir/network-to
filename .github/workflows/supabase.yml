name: Supabase

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.117.0
  DENO_VERSION: v2.5.2

jobs:
  validate:
    name: Validate database and functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Start local database
        run: supabase db start

      - name: Run database tests
        run: supabase test db supabase/tests/database --local

      - name: Type-check Edge Functions
        run: deno check supabase/functions/*/index.ts supabase/functions/_shared/*.ts

      - name: Run Edge Function unit tests
        run: deno test supabase/functions

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  # Staging receives every main deployment first. The job succeeds without
  # deploying until the `staging` GitHub environment holds its own project
  # secrets, so production is never blocked by an environment that does not
  # exist yet.
  deploy-staging:
    name: Deploy staging
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Detect staging configuration
        id: staging
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_PROJECT_ID" ]]; then
            echo "::notice::Staging deployment skipped: add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, and SUPABASE_PROJECT_ID to the staging GitHub environment to deploy there before production."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        if: steps.staging.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        if: steps.staging.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Link staging project
        if: steps.staging.outputs.configured == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        if: steps.staging.outputs.configured == 'true'
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy self-authenticating functions
        if: steps.staging.outputs.configured == 'true'
        run: supabase functions deploy auth-handoff app-store-notifications deliver-notifications company-marks --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api

      - name: Deploy authenticated functions
        if: steps.staging.outputs.configured == 'true'
        run: supabase functions deploy delete-account process-resume sync-subscription --project-ref "$SUPABASE_PROJECT_ID" --use-api

  deploy:
    name: Deploy production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [validate, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Require deployment secrets
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_PROJECT_ID" ]]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, and SUPABASE_PROJECT_ID in the production GitHub environment."
            exit 1
          fi

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      # auth-handoff serves browser callbacks, app-store-notifications is called by
      # Apple, deliver-notifications by the database schedule, and company-marks by
      # the product team and the retention job: none carry a Supabase JWT, so each
      # authenticates its caller itself.
      - name: Deploy self-authenticating functions
        run: supabase functions deploy auth-handoff app-store-notifications deliver-notifications company-marks --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api

      - name: Deploy authenticated functions
        run: supabase functions deploy delete-account process-resume sync-subscription --project-ref "$SUPABASE_PROJECT_ID" --use-api
